name: Verify

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
      content: ${{ steps.select.outputs.content }}
      website: ${{ steps.select.outputs.website }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/scripts/ci-checks.test.mjs
      - name: Select checks from all changed paths
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            node .github/scripts/ci-checks.mjs --all >> "$GITHUB_OUTPUT"
          else
            # Classify the complete branch, not only the last push. A docs follow-up
            # must not skip product checks cancelled by the preceding push.
            base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            git diff --no-renames --name-only -z "$base" "$HEAD_SHA" \
              | node .github/scripts/ci-checks.mjs >> "$GITHUB_OUTPUT"
          fi

  content:
    needs: changes
    if: needs.changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/check-content.mjs

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    # Match the Ubuntu versions supported by the locked Playwright browser installer.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  product:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: make verify

  rust:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: make check-rust
      - run: make skills-content-check
      - run: make test-rust

  shared-crates:
    name: Shared crate packages (Rust 1.85)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p fensu-policy
      - run: .github/scripts/verify_shared_crate_packages.sh

  performance:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: make benchmark-budget

  windows:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: cargo test -p fensu-cli --test command
      - run: uv run pytest tests -q -n auto

  native-package-smoke:
    needs: changes
    # Expand all required platform check names even when no native tests are selected.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: No native package work selected
        if: needs.changes.outputs.full == 'false'
        run: echo "Website/docs-only changes do not require native package tests."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.full == 'true'
      - uses: dtolnay/rust-toolchain@master
        if: needs.changes.outputs.full == 'true'
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.full == 'true'
      - uses: astral-sh/setup-uv@v6
        if: needs.changes.outputs.full == 'true'
      - run: uv python install 3.12
        if: needs.changes.outputs.full == 'true'
      - run: uv sync --locked --all-groups
        if: needs.changes.outputs.full == 'true'
      - run: uv run fensu --version
        if: needs.changes.outputs.full == 'true'
      - run: uv run pytest tests/e2e/src/fensu/cli/main/test_entry.py tests/e2e/src/fensu/cli/main/test_native_distribution.py -q
        if: needs.changes.outputs.full == 'true'

  web-parser-analyzer-smoke:
    needs: changes
    # Keep the matrix contexts stable; gate setup and tests rather than expansion.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: No parser or analyzer work selected
        if: needs.changes.outputs.full == 'false'
        run: echo "Website/docs-only changes do not require parser or analyzer tests."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.full == 'true'
      - uses: dtolnay/rust-toolchain@master
        if: needs.changes.outputs.full == 'true'
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.full == 'true'
      - run: cargo test -p fensu-rust -p fensu-typescript -p fensu-svelte
        if: needs.changes.outputs.full == 'true'
      - run: cargo test -p fensu-cli --lib
        if: needs.changes.outputs.full == 'true'
      - run: "cargo test -p fensu-cli --test command test_check_rust::"
        if: needs.changes.outputs.full == 'true'

  source-build:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uvx maturin sdist --out dist
      - run: uvx maturin sdist --out ../../dist
        working-directory: packages/fensu-cli
      - run: uv venv .source-venv --python 3.12
      - run: uv pip install --python .source-venv/bin/python --no-deps dist/*.tar.gz
      - run: .source-venv/bin/fensu --version

  verify:
    if: always()
    needs: [changes, content, website, product, rust, shared-crates, performance, windows, native-package-smoke, web-parser-analyzer-smoke, source-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require all selected checks to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-checks.mjs verify
