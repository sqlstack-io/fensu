[package]
name = "fensu-native"
version = "0.30.0" # x-release-please-version
edition.workspace = true
license.workspace = true
publish = true
description = "Fensu's core rule engine and Python rules, usable from Rust without the Python bindings"
repository = "https://github.com/sqlstack-io/fensu"
readme = "README.md"
keywords = ["lint", "architecture", "python", "static-analysis"]
categories = ["development-tools"]
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "fensu_native"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
flate2 = { workspace = true, optional = true }
globset.workspace = true
pyo3 = { workspace = true, optional = true }
rayon.workspace = true
ruff_python_ast.workspace = true
rusqlite = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
serde_json.workspace = true
fensu-facts = { workspace = true, default-features = false }
unicode-ident.workspace = true

[features]
default = ["python"]
extension-module = ["python", "pyo3/extension-module"]
python = ["dep:pyo3", "dep:rusqlite", "dep:flate2", "dep:sha2", "fensu-facts/python"]

[dev-dependencies]
serde.workspace = true
tempfile.workspace = true
