[package]
name = "fensu-facts"
version = "0.29.3" # x-release-please-version
edition.workspace = true
license.workspace = true
publish = true
description = "Python source facts for Fensu: parsed modules, imports, symbols and file inventory"
repository = "https://github.com/sqlstack-io/fensu"
readme = "README.md"
keywords = ["lint", "architecture", "python", "static-analysis"]
categories = ["development-tools"]
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "fensu_facts"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
dunce.workspace = true
# Not used directly: ruff_python_ast 0.0.4 needs a get-size2 built on compact_str 0.9, and 0.10.2 moved to 0.10.
get-size2.workspace = true
globset.workspace = true
hex.workspace = true
pyo3 = { workspace = true, optional = true }
rayon.workspace = true
ruff_python_ast.workspace = true
ruff_python_parser.workspace = true
ruff_text_size.workspace = true
sha2.workspace = true
walkdir.workspace = true

[features]
default = ["python"]
python = ["dep:pyo3"]
